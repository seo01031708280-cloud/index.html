 for(const b of B){g.fillStyle=b.col;g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}
 for(const f of FX){

   g.rotate(fl?f.a:f.a+Math.PI);if(fl)g.scale(-1,1);g.translate(-110,0);g.globalCompositeOperation='lighter';g.globalAlpha=al;
   if(SW.complete&&SW.naturalWidth){g.drawImage(SW,-W2/2,-H2/2,W2,H2);g.globalAlpha=al*.6;g.drawImage(SW,-W2/2,-H2/2,W2,H2)}

  else if(f.k==='laser'){const al=Math.min(1,f.t/.3),th=.7+.3*(f.t/.45);g.save();g.translate(f.x,f.y);g.rotate(f.a);g.globalCompositeOperation='lighter';g.globalAlpha=al;
   if(LS.complete&&LS.naturalWidth){g.drawImage(LS,0,-72*th,660,145*th)}else{g.fillStyle='rgba(80,255,120,.8)';g.fillRect(0,-8,660,16)}
   g.fillStyle='rgba(220,255,230,.9)';g.fillRect(0,-6*th,660,12*th);
   if(LF.complete&&LF.naturalWidth){g.drawImage(LF,-100,-100,200,200);g.drawImage(LF,595,-65,130,130)}
   g.restore()}
  else if(f.k==='ghost'){g.fillStyle='rgba(120,200,255,'+(f.t/.22*.45)+')';g.beginPath();g.ellipse(f.x,f.y,9,24,0,0,7);g.fill()}
  else if(f.k==='dash'){const al=f.t/.4,dx=f.x2-f.x1,dy=f.y2-f.y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,mx=(f.x1+f.x2)/2,my=(f.y1+f.y2)/2;
   g.save();g.globalCompositeOperation='lighter';
   for(const [w,col] of [[26,'rgba(40,120,255,'+(.5*al)+')'],[10,'rgba(150,220,255,'+al+')'],[3,'rgba(255,255,255,'+al+')']]){g.fillStyle=col;g.beginPath();g.moveTo(f.x1,f.y1);g.lineTo(mx+nx*w*al,my+ny*w*al);g.lineTo(f.x2,f.y2);g.lineTo(mx-nx*w*al,my-ny*w*al);g.closePath();g.fill()}
   g.restore()}
  else if(f.k==='mana'){g.strokeStyle='rgba(74,163,255,'+(f.t/.5)+')';g.lineWidth=5;g.beginPath();g.arc(P.x,P.y,14+(1-f.t/.5)*55,0,7);g.stroke()}
  else if(f.k==='heal'){g.strokeStyle='rgba(76,217,138,'+(f.t/.5)+')';g.lineWidth=4;g.beginPath();g.arc(P.x,P.y,12+(1-f.t/.5)*40,0,7);g.stroke()}
  else if(f.k==='ring'){g.strokeStyle='rgba(74,163,255,'+(f.t/.35)+')';g.lineWidth=6;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.stroke()}
  else{g.strokeStyle='rgba(255,240,120,'+(f.t/.25)+')';g.lineWidth=3;g.beginPath();g.moveTo(f.x1,f.y1);
   const m=6;for(let k=1;k<m;k++){const u=k/m;g.lineTo(f.x1+(f.x2-f.x1)*u+rnd(-8,8),f.y1+(f.y2-f.y1)*u+rnd(-8,8))}
   g.lineTo(f.x2,f.y2);g.stroke()}
 }
 g.fillStyle='#0006';g.beginPath();g.ellipse(P.x,P.y+20,13,5,0,0,7);g.fill();
 const bob=P.mv?Math.sin(T*16)*2:0;
 g.save();g.translate(P.x,P.y+20+bob);g.scale(-(P.face||1),1);
 if(P.inv>0&&((P.inv*20)|0)%2)g.globalAlpha=.35;
 if(SP.complete&&SP.naturalWidth)g.drawImage(SP,-11,-56,22.5,60);

 g.fillText('HP '+Math.ceil(P.hp),170,23);g.fillText('MP '+Math.floor(P.mana),170,39);
 bar(12,44,150,5,xp/need,'#4cd98a');

 const bs=E.find(e=>e.boss);
 if(bs){bar(W/2-110,78,220,10,bs.hp/bs.mh,'#ff5470');g.textAlign='center';g.fillText('보스  '+Math.ceil(bs.hp),W/2,74);g.textAlign='left'}
 if(msgT>0){g.textAlign='center';g.font='700 16px system-ui';g.fillStyle='#ffd54a';g.fillText(msg,W/2,H/2-60)}
 if(joy.on){g.strokeStyle='#fff4';g.lineWidth=2;g.beginPath();g.arc(joy.sx,joy.sy,50,0,7);g.stroke();

 if(over){
  g.fillStyle='#000a';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff';

  g.font='500 16px system-ui';g.fillText('처치 '+kills+' · 레벨 '+lvl+' · '+Math.floor(T)+'초',W/2,H/2+4);
  if(overT>.6)g.fillText('화면을 터치하면 다시 시작',W/2,H/2+40);
 }

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[k]=1;
 if(k==='1'||k==='j')cast(0);if(k==='2'||k==='k')cast(1);if(k==='3'||k==='l')cast(2);if(k==='4'||k==='i')cast(3);if(k==='5'||k==='o')cast(4);if(k==='u'&&!over)levelUp();if(k==='b'&&!over)spawnBoss();
 if(over&&overT>.6&&(k===' '||k==='enter'))init();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
btns.forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();cast(+b.dataset.i)}));
cv.addEventListener('pointerdown',e=>{
 if(over){if(overT>.6)init();return}
 if(joy.on)return;
 const r=cv.getBoundingClientRect();
 joy.on=true;joy.id=e.pointerId;joy.sx=e.clientX-r.left;joy.sy=e.clientY-r.top;joy.dx=joy.dy=0;
 cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
 if(!joy.on||e.pointerId!==joy.id)return;
 const r=cv.getBoundingClientRect(),x=e.clientX-r.left-joy.sx,y=e.clientY-r.top-joy.sy,d=Math.hypot(x,y);
 const k=d>50?50/d:1;joy.dx=x*k/50;joy.dy=y*k/50;
});
const up=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
